<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>
  <main class="login-page">
    <!-- Left side: Instagram screenshot -->
    <div class="phone-section">
      <img src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" alt="Instagram app screenshot" class="ig-screenshot">
    </div>

    <!-- Right side: Login form -->
    <div class="form-section">
      <div class="login-box">
        <h1 class="logo-text">Instagram</h1>
        <form id="loginForm" class="login-form">
          <input type="text" id="username" name="username" placeholder="Phone number, username, or email" required>
          <input type="password" id="password" name="password" placeholder="Password" required>
          <button type="submit" class="login-btn" id="loginBtn">Log In</button>
        </form>
        <div class="divider">
          <span class="line"></span>
          <span class="or-text">or</span>
          <span class="line"></span>
        </div>
        <div class="signup-section">
          <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
      </div>
      <div class="get-app">
        <p>Get the app</p>
      </div>
    </div>
  </main>

  <footer class="login-footer">
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Language</a>
      <a href="#">Meta Verified</a>
    </div>
    <div class="footer-copyright">
      <span>&copy; 2026 Instagram from Meta</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
